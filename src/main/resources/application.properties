spring.application.name=offersToClients

# --- Recommendations data source (H2 file database, read-only) ---
# Override with APPLICATION_RECOMMENDATIONS_DB_URL.
application.recommendations-db.url=jdbc:h2:file:./transaction

# --- Dynamic rules storage (PostgreSQL) ---
# Every property can be overridden by an environment variable:
#   SPRING_DATASOURCE_URL, SPRING_DATASOURCE_USERNAME, SPRING_DATASOURCE_PASSWORD
spring.datasource.url=jdbc:postgresql://localhost:5432/offers_db
spring.datasource.username=offers_user
spring.datasource.password=offers_password
spring.datasource.driver-class-name=org.postgresql.Driver

# --- JPA and schema migrations ---
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml

# --- Telegram bot (optional) ---
# The token is taken from the TELEGRAM_BOT_TOKEN environment variable and must never be committed.
# telegram.bot.token=
#
# Uncomment both lines if outbound HTTP traffic goes through a local proxy:
# telegram.bot.proxy.host=
# telegram.bot.proxy.port=
