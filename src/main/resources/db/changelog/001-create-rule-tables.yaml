databaseChangeLog:
  - changeSet:
      id: 001-create-rule-tables
      author: student
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE recommendation_rule (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  product_name VARCHAR(255) NOT NULL,
                  product_id UUID NOT NULL,
                  product_text TEXT NOT NULL
              );

              CREATE TABLE rule_query (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  rule_id BIGINT NOT NULL,
                  query_type VARCHAR(64) NOT NULL,
                  negate BOOLEAN NOT NULL DEFAULT FALSE,
                  position INTEGER NOT NULL,
                  CONSTRAINT fk_rule_query_rule
                      FOREIGN KEY (rule_id)
                      REFERENCES recommendation_rule (id)
                      ON DELETE CASCADE
              );

              CREATE TABLE rule_query_argument (
                  query_id BIGINT NOT NULL,
                  position INTEGER NOT NULL,
                  argument VARCHAR(255) NOT NULL,
                  CONSTRAINT pk_rule_query_argument
                      PRIMARY KEY (query_id, position),
                  CONSTRAINT fk_rule_query_argument_query
                      FOREIGN KEY (query_id)
                      REFERENCES rule_query (id)
                      ON DELETE CASCADE
              );