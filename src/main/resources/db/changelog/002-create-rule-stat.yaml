databaseChangeLog:
  - changeSet:
      id: 002-create-rule-stat
      author: student
      changes:
        - sql:
            splitStatements: true
            sql: |
              CREATE TABLE rule_stat (
                  id BIGINT GENERATED BY DEFAULT AS IDENTITY PRIMARY KEY,
                  rule_id BIGINT NOT NULL,
                  hit_count BIGINT NOT NULL DEFAULT 0,
                  CONSTRAINT uq_rule_stat_rule UNIQUE (rule_id),
                  CONSTRAINT fk_rule_stat_rule
                      FOREIGN KEY (rule_id)
                      REFERENCES recommendation_rule (id)
                      ON DELETE CASCADE
              );